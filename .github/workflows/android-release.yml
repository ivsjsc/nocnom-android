name: Android Release AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Validate release secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo 'Missing ANDROID_KEYSTORE_BASE64' && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo 'Missing ANDROID_KEYSTORE_PASSWORD' && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo 'Missing ANDROID_KEY_ALIAS' && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo 'Missing ANDROID_KEY_PASSWORD' && exit 1)
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || (echo 'Missing GOOGLE_SERVICES_JSON_BASE64' && exit 1)

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode > "$RUNNER_TEMP/nocnom-upload.jks"

      - name: Restore and validate Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
              | tr -d '\r\n\t ' \
              | base64 --decode > app/google-services.json
          fi
          jq empty app/google-services.json
          test "$(jq -r '.project_info.project_id' app/google-services.json)" = "cocoa-35632"
          test "$(jq -r '.client[0].client_info.android_client_info.package_name' app/google-services.json)" = "vn.ivsjsc.nocnom"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nocnom-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:bundleRelease

      - name: Verify bundle signature
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: nocnom-play-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
