name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore Firebase config when available
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          test "$(jq -r '.project_info.project_id' app/google-services.json)" = "cocoa-35632"
          test "$(jq -r '.client[0].client_info.android_client_info.package_name' app/google-services.json)" = "vn.ivsjsc.nocnom"

      - name: Unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nocnom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
